<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2433">
<title>Мой большой мир — Севиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="app" data-theme="home">
  <header class="topbar">
    <div class="brand"><img src="img/sevil-face.jpg" alt="" width="34" height="34"><span id="brandTitle"></span></div>
    <button class="iconbtn" id="mute" aria-label="Выключить звук"></button>
  </header>

  <main id="pages"></main>

  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

  <div class="modal" id="medal" role="dialog" aria-modal="true" aria-label="Награда">
    <div class="modalCard">
      <div class="rays"></div>
      <div id="mArt" class="mart"></div>
      <h2 id="mName"></h2>
      <p id="mText"></p>
      <button class="btn primary" id="mOk">Продолжить</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="splash" id="splash">
    <div class="splashSky" id="splashSky"></div>
    <div class="splashBody">
      <img class="arch" src="img/sevil.jpg" alt="Севиль" width="150" height="240">
      <h1 id="sTitle"></h1>
      <p id="sHello"></p>
      <button class="btn primary big" id="enter"></button>
      <small>🔊 Включи звук на телефоне</small>
    </div>
  </div>
</div>

<script src="content.js?v=33"></script>
<script src="art.js?v=33"></script>
<script src="art2.js?v=33"></script>
<script src="art3.js?v=33"></script>
<script src="app.js?v=33"></script>
</body>
</html>
