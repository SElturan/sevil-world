<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1230">
<title>Мой большой мир — Севиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Nunito:wght@700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=42">
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="stage">
  <div id="scenes"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vig"></div>

  <div class="topui" id="topui">
    <div id="segs" aria-hidden="true"></div>
    <button class="iconbtn" id="mute" aria-label="Выключить звук">🔊</button>
  </div>

  <div class="caption" id="cap" aria-live="polite">
    <img class="mini" src="img/sevil-face.jpg" alt="Севиль" width="64" height="64">
    <div class="ctext"><span class="area" id="area"></span><h2 id="line"></h2></div>
  </div>

  <div class="zones" id="zones" aria-hidden="true"></div>
  <div class="hint" id="hint">Нажми справа — дальше · Удерживай — пауза</div>

  <section class="intro" id="intro">
    <div class="introLayers" id="introLayers"></div>
    <div class="rays big"></div>
    <div class="introBody">
      <img class="arch" src="img/sevil.jpg" alt="Севиль" width="150" height="240">
      <h1 id="iTitle"></h1>
      <p id="iHello"></p>
      <button class="tapbtn" id="enter"></button>
    </div>
  </section>

  <section class="finale" id="finale">
    <div class="introLayers" id="finaleLayers"></div>
    <div class="rays big"></div>
    <div class="fBody">
      <div class="meds" id="meds"></div>
      <h2 id="fText"></h2>
      <p class="credit" id="fCredit"></p>
      <button class="tapbtn small" id="again">Смотреть ещё раз ↺</button>
    </div>
  </section>
</div>

<script src="content.js?v=42"></script>
<script src="art.js?v=42"></script>
<script src="art2.js?v=42"></script>
<script src="scenes.js?v=42"></script>
<script src="app.js?v=42"></script>
</body>
</html>
