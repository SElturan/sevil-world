<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14524f">
<title>Мой большой мир — Севиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Nunito:wght@700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=54">
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="stage">
  <!-- Главная страница книги: большой мир -->
  <section id="hub" aria-label="Мой большой мир">
    <div id="hubLayers"></div>
    <div id="spots"></div>
    <div class="medalrow" id="medalrow" aria-label="Медали"></div>
    <div class="hubHint" id="hubHint">Выбери: семья, школа или Родина</div>
  </section>

  <!-- Рассказ -->
  <section id="story" aria-label="Рассказ">
    <div id="scenes"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="vig"></div>
    <div class="topui" id="topui">
      <div id="segs" aria-hidden="true"></div>
    </div>
    <div class="caption" id="cap" aria-live="polite">
      <img class="mini" src="img/sevil-face.jpg" alt="Севиль" width="64" height="64">
      <div class="ctext"><span class="area" id="area"></span><h2 id="line"></h2></div>
    </div>
    <div class="zones" id="zones" aria-hidden="true"></div>
    <div class="hint" id="hint">Нажми справа — дальше · Удерживай — пауза</div>
  </section>

  <button class="iconbtn" id="home" aria-label="В книгу">📖</button>
  <button class="iconbtn" id="mute" aria-label="Выключить звук">🔊</button>

  <!-- Награда -->
  <div class="modal" id="medal" role="dialog" aria-modal="true" aria-label="Награда">
    <div class="modalCard">
      <div id="mArt" class="mart"></div>
      <h2 id="mName"></h2>
      <p id="mText"></p>
      <button class="tapbtn small" id="mOk">В книгу ▶</button>
    </div>
  </div>

  <!-- Финал -->
  <section class="finale" id="finale">
    <div class="introLayers" id="finaleLayers"></div>
    <div class="rays big"></div>
    <div class="fBody">
      <div class="meds" id="meds"></div>
      <h2 id="fText"></h2>
      <p class="credit" id="fCredit"></p>
      <button class="tapbtn small" id="again">Вернуться в книгу ↺</button>
    </div>
  </section>

  <!-- Обложка книги -->
  <section class="book" id="book" aria-label="Обложка">
    <div class="cover" id="cover">
      <div class="face front"><div id="coverArt"></div><div class="rays big gold"></div><button class="tapbtn" id="enter"></button></div>
      <div class="face back"></div>
    </div>
  </section>
</div>

<script src="content.js?v=54"></script>
<script src="art.js?v=54"></script>
<script src="art2.js?v=54"></script>
<script src="chars.js?v=54"></script>
<script src="paper.js?v=54"></script>
<script src="app.js?v=54"></script>
</body>
</html>
